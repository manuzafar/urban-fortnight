name: Agent Evals

on:
  push:
    branches: [main]
    paths:
      - 'backend/agents/**'
      - 'backend/models/**'
      - 'backend/evals/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/agents/**'
      - 'backend/models/**'
      - 'backend/evals/**'
  workflow_dispatch:

jobs:
  unit-evals:
    name: Unit Evals (Fast)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Unit Evals on Test Output
        run: |
          cd backend
          LATEST_OUTPUT=$(ls -t test_outputs/e2e_test_*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_OUTPUT" ]; then
            echo "No test outputs found, skipping evals"
            exit 0
          fi
          echo "Running unit evals on $LATEST_OUTPUT"
          python -m evals.cli run "$LATEST_OUTPUT" -t unit -t agent_specific --format json --output eval_results.json

      - name: Upload Eval Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-eval-results
          path: backend/eval_results.json
          retention-days: 30

  full-evals:
    name: Full Evals (LLM Judge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Full Evals
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd backend
          LATEST_OUTPUT=$(ls -t test_outputs/e2e_test_*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_OUTPUT" ]; then
            echo "No test outputs found, skipping evals"
            exit 0
          fi
          echo "Running full evals on $LATEST_OUTPUT"
          python -m evals.cli run "$LATEST_OUTPUT" --format json --output full_eval_results.json

      - name: Upload Full Eval Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-eval-results
          path: backend/full_eval_results.json
          retention-days: 30

      - name: Post Results Summary
        if: always()
        run: |
          cd backend
          if [ -f full_eval_results.json ]; then
            echo "## Eval Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYTHON_SCRIPT' >> $GITHUB_STEP_SUMMARY
          import json
          with open('full_eval_results.json') as f:
              results = json.load(f)
          print("| Metric | Value |")
          print("|--------|-------|")
          print(f"| Overall Score | {results.get('overall_score', 'N/A')} |")
          print(f"| Total Evals | {results.get('total_evals', 0)} |")
          print(f"| Passed | {results.get('passed', 0)} |")
          print(f"| Failed | {results.get('failed', 0)} |")
          print(f"| Warnings | {results.get('warnings', 0)} |")
          PYTHON_SCRIPT
          fi

  golden-set-comparison:
    name: Golden Set Regression Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: List Golden Sets
        run: |
          cd backend
          echo "## Available Golden Sets" >> $GITHUB_STEP_SUMMARY
          python -m evals.cli golden list --format json | python3 -c "
          import json, sys
          sets = json.load(sys.stdin)
          print(f'Found {len(sets)} golden sets')
          for gs in sets:
              print(f\"- {gs['id']}: {gs['name']} ({gs.get('domain', 'N/A')})\")
          " >> $GITHUB_STEP_SUMMARY || echo "No golden sets found"

      - name: Run Golden Set Comparison
        id: golden_compare
        run: |
          cd backend
          LATEST_OUTPUT=$(ls -t test_outputs/e2e_test_*.json 2>/dev/null | head -1)
          if [ -z "$LATEST_OUTPUT" ]; then
            echo "No test outputs found, skipping golden set comparison"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Comparing $LATEST_OUTPUT against golden sets..."

          # Run comparison with 40% threshold (allow some variation)
          python -m evals.cli golden compare "$LATEST_OUTPUT" \
            --output golden_comparison.json \
            --threshold 0.4 \
            --verbose || COMPARE_FAILED=1

          if [ "$COMPARE_FAILED" = "1" ]; then
            echo "status=regression" >> $GITHUB_OUTPUT
          else
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Post Golden Set Results
        if: always()
        run: |
          cd backend
          if [ -f golden_comparison.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Golden Set Comparison Results" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYTHON_SCRIPT' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              with open('golden_comparison.json') as f:
                  results = json.load(f)

              best_match = results.get('best_match', 'N/A')
              best_score = results.get('best_score', 0)

              print(f"| Metric | Value |")
              print(f"|--------|-------|")
              print(f"| Best Match | {best_match} |")
              print(f"| Best Score | {best_score:.1%} |")
              print(f"| Golden Sets Compared | {len(results.get('all_comparisons', {}))} |")

              if best_score < 0.4:
                  print("")
                  print("**Warning**: Low similarity to golden sets. Review output quality.")
          except Exception as e:
              print(f"Error reading results: {e}")
          PYTHON_SCRIPT
          fi

      - name: Upload Golden Set Comparison
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-set-comparison
          path: backend/golden_comparison.json
          retention-days: 30

      - name: Fail on Critical Regression
        if: steps.golden_compare.outputs.status == 'regression'
        run: |
          echo "Golden set regression detected! Output quality significantly lower than baselines."
          echo "Review golden_comparison.json for details."
          exit 1

  eval-tests:
    name: Eval System Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Eval Tests
        run: |
          cd backend
          pytest tests/evals/ -v --tb=short
