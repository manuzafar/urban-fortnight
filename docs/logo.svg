<svg width="120" height="120" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring - represents discovery/exploration -->
  <circle cx="24" cy="24" r="22" stroke="url(#logoGradient)" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Inner hexagon - represents product structure -->
  <path
    d="M24 6L38.5 15V33L24 42L9.5 33V15L24 6Z"
    fill="url(#hexGradient)"
    stroke="url(#logoGradient)"
    stroke-width="1.5"
  />

  <!-- Lightbulb/idea element in center -->
  <path
    d="M24 14C20 14 17 17 17 21C17 24 19 26 20 27.5V30C20 31 21 32 22 32H26C27 32 28 31 28 30V27.5C29 26 31 24 31 21C31 17 28 14 24 14Z"
    fill="white"
    fill-opacity="0.9"
  />
  <rect x="21" y="33" width="6" height="2" rx="1" fill="white" fill-opacity="0.7" />

  <!-- Spark elements -->
  <circle cx="24" cy="20" r="2" fill="url(#sparkGradient)" />
  <path d="M36 10L38 8M10 38L12 36M38 38L36 36M10 10L12 12" stroke="url(#logoGradient)" stroke-width="1.5" stroke-linecap="round" />

  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="hexGradient" x1="9.5" y1="6" x2="38.5" y2="42">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="sparkGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>
</svg>
