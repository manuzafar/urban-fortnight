    "deployment_strategy": "The platform will be deployed using a continuous delivery pipeline. There will be three environments: development, staging, and production. Each environment will have its own dedicated infrastructure. Containerization will be used to package the microservices, and Kubernetes will be used for orchestration. Blue-green deployments will be used to minimize downtime during deployments. Rollback procedures will be in place to quickly revert to a previous version in case of issues.",

    "scalability_approach": "Horizontal scaling will be used to scale the microservices, with multiple instances of each service running behind a load balancer. Auto-scaling will be triggered based on CPU utilization and memory usage. The database will be scaled using read replicas and data partitioning. Redis will be used to cache frequently accessed data, reducing database load. A CDN (Content Delivery Network) will be used to cache static assets, improving frontend performance.",
    "security_architecture": "Authentication will be handled using Auth0, which provides a secure and scalable authentication platform. Authorization will be based on RBAC (Role-Based Access Control), with different roles having different permissions. Data will be encrypted at rest using AES-256 encryption and in transit using TLS. API security measures will include rate limiting, input validation, and output encoding to prevent common web vulnerabilities. The platform will be designed to comply with relevant data privacy regulations, such as GDPR and CCPA.",

        // Render functions
        function renderValue(val, depth = 0) {
            if (val === null || val === undefined) return '<span style="color:#9ca3af">N/A</span>';
            if (typeof val === 'boolean') return val ? '✓ Yes' : '✗ No';
            if (typeof val === 'number') return val.toLocaleString();
            if (typeof val === 'string') {
                if (val.length > 500 && depth > 0) return val.substring(0, 500) + '...';
                return val;
            }
            if (Array.isArray(val)) {
                if (val.length === 0) return '<span style="color:#9ca3af">None</span>';
                if (typeof val[0] === 'string') {
                    return '<ul>' + val.map(v => `<li>${v}</li>`).join('') + '</ul>';
                }
                return val.map(v => renderValue(v, depth + 1)).join('<br>');
            }
            if (typeof val === 'object') {
                return Object.entries(val).map(([k, v]) => 
                    `<div class="card"><div class="card-title">${k.replace(/_/g, ' ')}</div><div class="card-content">${renderValue(v, depth + 1)}</div></div>`
                ).join('');
            }
            return String(val);
        }

        function renderSection(title, data, id) {
            if (!data) return '';
            let html = `<section class="section" id="${id}"><h2>${title}</h2>`;
            if (typeof data === 'string') {
                html += `<p>${data}</p>`;
            } else if (typeof data === 'object') {
                html += '<div class="grid">';
                for (const [key, value] of Object.entries(data)) {
                    if (key === 'html_code' || key === 'css_code' || key === 'js_code') continue;
                    html += `<div class="card"><div class="card-title">${key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div><div class="card-content">${renderValue(value)}</div></div>`;
                }
                html += '</div>';
            }
            html += '</section>';
            return html;
        }

        // Main render
        document.getElementById('title').textContent = pack.executive_summary?.product_name || 'Inception Pack';
        document.getElementById('subtitle').textContent = pack.executive_summary?.one_liner || '';
        
        const meta = document.getElementById('meta');
        if (pack.metadata) {
            meta.innerHTML = `
                <span class="meta-item">📅 ${new Date(pack.metadata.generated_at).toLocaleDateString()}</span>
                <span class="meta-item">⏱️ ${Math.round(pack.metadata.total_duration_seconds / 60)} min</span>
                <span class="meta-item">🎯 Quality: ${(pack.metadata.quality_score * 100).toFixed(0)}%</span>
                <span class="meta-item">🔢 ${parseInt(pack.metadata.total_tokens_used).toLocaleString()} tokens</span>
            `;
        }

        let content = '';
        content += renderSection('Executive Summary', pack.executive_summary, 'executive');
        content += renderSection('Customer Research', pack.customer_research, 'customer');
        content += renderSection('Business Strategy', pack.business_case, 'business');
        content += renderSection('Go-to-Market Strategy', pack.gtm_strategy, 'gtm');
        content += renderSection('Financial Projections', pack.financial_projections, 'financial');
        content += renderSection('Product Requirements', pack.product_requirements, 'prd');
        content += renderSection('Technical Architecture', pack.technical_architecture, 'technical');
        content += renderSection('Legal & Regulatory', pack.legal_regulatory, 'legal');
        content += renderSection('Risk Assessment', pack.risk_assessment, 'risk');
        
        // Prototype section with iframe
        if (pack.prototype?.html_code) {
            content += `<section class="section" id="prototype"><h2>Interactive Prototype</h2>`;
            content += `<p style="margin-bottom:16px">${pack.prototype.story_summary || ''}</p>`;
            const protoHtml = `<!DOCTYPE html><html><head><style>${pack.prototype.css_code || ''}</style></head><body>${pack.prototype.html_code}<script>${pack.prototype.js_code || ''}<\/script></body></html>`;
            content += `<iframe class="proto-frame" srcdoc="${protoHtml.replace(/"/g, '&quot;')}"></iframe>`;
            content += `</section>`;
        }

        document.getElementById('content').innerHTML = content;
    </script>
